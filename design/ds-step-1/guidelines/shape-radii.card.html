<!-- @dsCard group="Форма" viewport="700x200" name="Радиусы" subtitle="8 у кнопок и полей 36 и 44; 12 у 52 и 60 и аватаров; 16 у карточек; 20 у тегов; 24 у панелей и окон; 32 у пилюль" -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../guidelines/card.css">
</head>
<body>
<div class="ds-row" style="gap:16px;align-items:flex-end"><div class="ds-swatch" style="width:96px"><div style="height:64px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-control)"></div><div class="ds-swatch__name">8 px</div><div class="ds-swatch__val">--radius-control<br>кнопки и поля 36, 44</div></div><div class="ds-swatch" style="width:96px"><div style="height:64px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-control-lg)"></div><div class="ds-swatch__name">12 px</div><div class="ds-swatch__val">--radius-control-lg<br>кнопки 52, аватары</div></div><div class="ds-swatch" style="width:96px"><div style="height:64px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-card)"></div><div class="ds-swatch__name">16 px</div><div class="ds-swatch__val">--radius-card<br>карточки</div></div><div class="ds-swatch" style="width:96px"><div style="height:64px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-tag)"></div><div class="ds-swatch__name">20 px</div><div class="ds-swatch__val">--radius-tag<br>теги, бейджи</div></div><div class="ds-swatch" style="width:96px"><div style="height:64px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-panel)"></div><div class="ds-swatch__name">24 px</div><div class="ds-swatch__val">--radius-panel<br>панели, окна</div></div><div class="ds-swatch" style="width:96px"><div style="height:64px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-pill)"></div><div class="ds-swatch__name">32 px</div><div class="ds-swatch__val">--radius-pill<br>фильтры-пилюли</div></div></div></body>
</html>
