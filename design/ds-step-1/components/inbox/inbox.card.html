</head>
<body>
<div id="root"></div>
<script type="text/babel">

        <div className="ds-row" style={{ alignItems: 'flex-start' }}>
          <C.RequestCard style={{ flex: 1 }} role="recipient" request={{ from: 'Тарас Рева', to: 'Евгений Ф.', text: 'Посмотреть расчёт по КАСКО до пятницы', due: 'пт 09.10', task: '№131 Оценить рынок КАСКО', status: 'waiting', created: 'сегодня, 10:12' }} />
